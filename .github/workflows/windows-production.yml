name: Windows production EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-production.yml'

permissions:
  contents: read

jobs:
  tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: avtar_isolation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: avtar_isolation_test
      DB_USERNAME: root
      DB_PASSWORD: ''
      DB_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Verify backend restaurant data isolation
        working-directory: backend
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan test --filter=test_auth_and_tenant_isolation
  build:
    needs: tenant-isolation
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install dependencies and verify owner code and analytics
        working-directory: frontend
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { throw 'Dependency resolution failed' }
          flutter test --no-pub test/account_login_test.dart test/login_layout_test.dart test/demo_startup_test.dart test/offline_sync_test.dart test/owner_code_setup_test.dart test/analytics_graph_test.dart test/usability_flow_test.dart
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build production Windows client
        working-directory: frontend
        run: |
          flutter build windows --no-pub --release --build-name=1.0.31 --build-number=33 --dart-define=APP_VERSION=1.0.31 --dart-define=DEMO_MODE=false
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Package single-file client setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $PWD 'frontend/build/windows/x64/runner/Release'
          if (!(Test-Path "$runtime/AvtarPOS.exe")) { throw 'Missing Windows client' }
          $work = Join-Path $env:RUNNER_TEMP 'avtar-package'
          $output = Join-Path $PWD 'dist/windows'
          New-Item -ItemType Directory -Force -Path $work,$output | Out-Null
          $payload = Join-Path $work 'runtime.zip'
          Compress-Archive -Path "$runtime/*" -DestinationPath $payload
          $redist = Join-Path $work 'vc_redist.x64.exe'
          Invoke-WebRequest 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $redist
          if ((Get-AuthenticodeSignature $redist).Status -ne 'Valid') { throw 'Runtime signature validation failed' }
          $source = Get-Content 'tools/packaging/AvtarPosSelfInstaller.cs' -Raw
          $source = $source.Replace('private const string ProductVersion = "0.0.0";', 'private const string ProductVersion = "1.0.31";')
          $source = $source.Replace('AssemblyVersion("0.0.0.0")', 'AssemblyVersion("1.0.31.0")')
          $source = $source.Replace('AssemblyFileVersion("0.0.0.0")', 'AssemblyFileVersion("1.0.31.0")')
          $sourcePath = Join-Path $work 'Setup.cs'
          [IO.File]::WriteAllText($sourcePath,$source,[Text.UTF8Encoding]::new($false))
          $setup = Join-Path $output 'AvtarPOS-Client-Setup-1.0.31.exe'
          $compiler = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          & $compiler /nologo /target:winexe "/out:$setup" "/win32icon:$PWD/frontend/windows/runner/resources/app_icon.ico" /r:System.Windows.Forms.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll "/resource:$payload,AvtarPOS.Payload" "/resource:$redist,AvtarPOS.VCRedist" $sourcePath
          if ($LASTEXITCODE -ne 0) { throw 'Setup compilation failed' }
          @('Avtar POS 1.0.31 Windows x64 production client.', 'Run AvtarPOS-Client-Setup-1.0.31.exe and sign in with your restaurant account.', 'Live API: https://avtarpos.duckdns.org/api', 'Orders and bills save locally first, then sync online.', 'Server database credentials are not included in this client.') | Set-Content "$output/README.txt"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AvtarPOS-Client-Setup-1.0.31.exe" | Set-Content "$output/SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: AvtarPOS-Windows-1.0.31
          path: dist/windows/
          retention-days: 30
          if-no-files-found: error
